# @package _global_

defaults:
  - override /data: libero_2cam
  - override /model: fastwam_dino_s_smallvideo
  - _self_

# DINO-S + smaller DinoVideoDiT. This is the fast/memory-light option.
batch_size: 4
num_workers: 8

model:
  mot_checkpoint_mixed_attn: true
  dino_config:
    input_resolution: [224, 448]
    latent_spatial_pool: [1, 2]  # DINO sees full 2cam 14x28, VideoDiT trains on pooled 14x14.
    encode_microbatch_size: 16

# scheduler
lr_scheduler_type: "cosine"
learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 200

# training
gradient_accumulation_steps: 4
weight_decay: 1e-2
resume: null
